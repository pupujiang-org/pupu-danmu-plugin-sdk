[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pupu-danmu-plugin-sdk"
version = "0.2.0.dev0"
description = "Protocol v2 data contracts and local replay tools for Pupu Danmu plugins"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pupujiang" }]
keywords = ["pupu-danmu", "plugin", "sdk", "protocol", "replay"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
pupu-danmu-plugin-replay = "pupu_danmu_plugin_sdk.replay:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.3"]

[tool.ruff.lint]
# Keep the established ValueError contract for invalid replay inputs.
ignore = ["TRY004"]

[tool.hatch.build.targets.wheel]
packages = ["src/pupu_danmu_plugin_sdk"]

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "tests/**",
  "docs/**",
  "scripts/**",
  "README.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
